<!doctype html>
<html>

<head>
    <title>{% if report_name and report_name != 'next' %}OneTask: {{ report_name.capitalize() }}{% else %}OneTask{% endif %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <a href="/stats{{ '?report=' + request.args.get('report', 'next') }}" class="stats-link">Stats</a>
    <a href="/list{{ '?report=' + request.args.get('report', 'next') }}" class="list-link">List</a>
    <div class="task-name-container">
        <h1 class="task-name" onclick="enterTitleEditMode()">{{ formatted_tasks[currentTaskIndex] }}</h1>
    </div>
    <div class="title-edit-form" id="title-edit-form" style="display: none;">
        <input type="text" id="title-input" class="title-input">
        <div class="title-form-buttons">
            <button id="save-title">Save</button>
            <button id="cancel-title">Cancel</button>
        </div>
    </div>
    <div class="task-id-display" onclick="copyTaskId()">
        ID: <span id="current-task-id">{{ short_ids[currentTaskIndex] }}</span>
    </div>
    <div id="countdown" class="countdown-box" onclick="toggleTimer()">
    </div>
    <div id="estimate-fallback-notice" class="estimate-fallback-notice" style="display: none;">
        No estimate configured — using a default 25m timer
    </div>
    <div class="actions">
        <button onclick="goToPreviousTask()">
            << Previous
        </button>
        <button class="completeButton" onclick="completeTask()">Complete Task</button>
        <button onclick="skipToNextTask()">Next >></button>
    </div>
    <h2 class="url"><a href="#" target="_blank">Link</a></h2>
    
    <!-- Task Details Section (Hidden by default) -->
    <div id="task-details" class="task-details" style="display: none;">
        <div class="task-details-header">
            <h3>Task Details</h3>
            <button id="toggle-details" class="toggle-button">Hide</button>
        </div>
        
        <!-- Annotations Section -->
        <div class="details-section">
            <div class="notes-section-header">
                <h4>Notes</h4>
                <button id="sort-annotations" class="toggle-button">Newest first</button>
            </div>
            <div id="annotations-list"></div>
            <div class="annotation-form">
                <textarea id="new-annotation" placeholder="Add a note..." rows="3"></textarea>
                <button id="save-annotation">Save Note</button>
            </div>
        </div>
        
        <!-- Due Date Section -->
        <div class="details-section">
            <h4>Due Date</h4>
            <div id="due-date-display"></div>
            <div class="due-date-form">
                <input type="date" id="new-due-date">
                <button id="save-due-date">Save Due Date</button>
                <button id="due-today">Due Today</button>
                <button id="remove-due-date">Remove</button>
            </div>
        </div>
        
        <!-- Tags Section -->
        <div class="details-section">
            <div class="tags-section-header">
                <h4>Tags</h4>
                <div class="tag-header-buttons">
                    <button id="add-tag-btn" class="tag-action-btn" title="Add tag">+</button>
                    <button id="remove-tag-btn" class="tag-action-btn" title="Remove tag">−</button>
                </div>
            </div>
            <div id="tags-display"></div>
            <div class="tag-add-form" id="tag-add-form" style="display: none;">
                <input type="text" id="new-tag-input" placeholder="Tag name...">
                <div class="tag-form-buttons">
                    <button id="save-tag">Add</button>
                    <button id="cancel-tag">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Priority Section -->
        <div class="details-section">
            <h4>Priority</h4>
            <div id="priority-display"></div>
            <div class="priority-edit-form" id="priority-edit-form" style="display: none;">
                <select id="priority-select" class="priority-select"></select>
                <div class="priority-form-buttons">
                    <button id="save-priority">Save</button>
                    <button id="cancel-priority">Cancel</button>
                </div>
            </div>
        </div>

        <!-- URL Section -->
        <div class="details-section">
            <h4>Link</h4>
            <div id="url-display"></div>
            <div class="url-edit-form" id="url-edit-form" style="display: none;">
                <input type="text" id="url-input" placeholder="https://...">
                <div class="url-form-buttons">
                    <button id="save-url">Save</button>
                    <button id="cancel-url">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tag Modal -->
    <div id="tag-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" id="tag-modal-close">&times;</span>
            <h3 id="modal-tag-title">Tasks with tag: </h3>
            <div id="modal-task-list"></div>
        </div>
    </div>

    <script type="text/javascript">
    // Get the remaining seconds from the app and convert it to a moment.js object
    var currentTaskIndex = {{ currentTaskIndex }}; // Keep track of the current task index
    var taskUrl = {{ task_urls | tojson }}
    var numTasks = {{ num_tasks }}; // Total number of tasks
    var remainingSeconds = {{ remaining_seconds | tojson }};
    var estimateIsDefault = {{ estimate_is_default | tojson }};
    var formatted_tasks = {{ formatted_tasks | tojson }};
    var task_id = {{ task_id | tojson }};
    var taskseries_id = {{ taskseries_id | tojson }};
    var truelist_id = {{ truelist_id | tojson }};
    var short_ids = {{ short_ids | tojson }};
    var task_annotations = {{ task_annotations | tojson }};
    var annotationSortNewest = true;
    var task_due_dates = {{ task_due_dates | tojson }};
    var task_tags = {{ task_tags | tojson }};
    var task_names = {{ task_names | tojson }};
    var task_priorities = {{ task_priorities | tojson }};
    var priorityValues = {{ priority_values | tojson }};
    var remainingTime = moment.duration(remainingSeconds[currentTaskIndex], 'seconds');
    var countdownBox = document.querySelector('.countdown-box');
    var countdownInterval;
    var isPaused = false;
    var overdue = false;
    var completedTasks = [];
    var lastUpdateTime = moment();
    var taskDetailsVisible = false;

    // Function to update the link based on task URL
    function updateLink() {
        var url = taskUrl[currentTaskIndex];
        console.log('Task URL:', url);
        console.log('currentTaskIndex: ', currentTaskIndex);
        var linkElement = document.querySelector('.url a');

        // Check if task URL is "none" or empty
        if (!url || url.toLowerCase() === 'none') {
            linkElement.href = '#';
            linkElement.innerText = "";
        } else {
            // Check if task URL lacks http or https protocol
            // But preserve app links (custom protocols like joplin://, obsidian://, etc.)
            if (!url.startsWith('http://') && !url.startsWith('https://') && !url.includes('://')) {
                url = 'http://' + url; // Add http protocol only for domain-like URLs
            }
            linkElement.href = url;
            linkElement.innerText = "Link"; // Set inner text to the URL

        }
    }

    // Function to update the task ID display
    function updateTaskId() {
        var taskIdElement = document.getElementById('current-task-id');
        taskIdElement.textContent = short_ids[currentTaskIndex];
    }

    // Show/hide the "using default estimate" notice (ON-66/A2)
    function updateEstimateNotice() {
        var notice = document.getElementById('estimate-fallback-notice');
        notice.style.display = estimateIsDefault[currentTaskIndex] ? 'block' : 'none';
    }

    // Function to copy task ID to clipboard
    function copyTaskId() {
        var taskId = short_ids[currentTaskIndex];
        navigator.clipboard.writeText(taskId).then(function() {
            console.log('Task ID copied to clipboard: ' + taskId);
            // Visual feedback
            var taskIdDisplay = document.querySelector('.task-id-display');
            var originalText = taskIdDisplay.innerHTML;
            taskIdDisplay.innerHTML = 'ID: <span>Copied!</span>';
            setTimeout(function() {
                taskIdDisplay.innerHTML = originalText;
            }, 1000);
        }).catch(function(err) {
            console.error('Failed to copy task ID: ', err);
        });
    }

    // Function to copy annotation text to clipboard
    function copyAnnotation(text, element) {
        navigator.clipboard.writeText(text).then(function() {
            console.log('Annotation copied to clipboard: ' + text);
            // Visual feedback
            var originalText = element.innerHTML;
            element.innerHTML = 'Copied!';
            setTimeout(function() {
                element.innerHTML = originalText;
            }, 1000);
        }).catch(function(err) {
            console.error('Failed to copy annotation: ', err);
        });
    }

    // turn the timer on or off by clicking in the box
    function toggleTimer() {
        if (isPaused) {
            resumeTimer();
        } else {
            pauseTimer();
        }
    }

    function pauseTimer() {
        clearInterval(countdownInterval);
        countdownBox.style.backgroundColor = '#e6d7d7';
        countdownBox.style.color = '#c2c2c2';
        isPaused = true;
    }

    function resumeTimer() {
        if (overdue) {
            countdownBox.style.backgroundColor = '#df4343';
        } else {
            countdownBox.style.backgroundColor = '#4d4d4d';
        }
        countdownBox.style.color = '#f8f8f8';
        isPaused = false;
        lastUpdateTime = moment(); // Reset the update time when resuming
        countdownInterval = setInterval(updateCountdown, 1000); // Start the countdown interval
    }

    // button functions (updated versions are at the bottom of the script)

    function completeTask() {
        // Check if the task is completed
        if (isTaskCompleted(currentTaskIndex)) {
            // Perform uncomplete actions (e.g., restart the timer)
            uncompleteTask();
        } else {
            // Make a POST request to complete the task
            fetch('/complete_task', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 'truelist_id': truelist_id[currentTaskIndex],
                    'taskseries_id': taskseries_id[currentTaskIndex],
                    'task_id': task_id[currentTaskIndex] })
            })
            .then(response => {
                console.log('task_id: ', task_id[currentTaskIndex])
                console.log('taskseries_id: ', taskseries_id[currentTaskIndex])
                console.log('truelist_id: ', truelist_id[currentTaskIndex])

                console.log('Response from server:', response);
                return response.json();})

            .then(data => {
                console.log('Completed Task: ', formatted_tasks[currentTaskIndex]);

                // Update the completedTasks array
                completedTasks.push(currentTaskIndex);

                // Update the UI with the completion status
                updateTaskName();
                skipToNextTask();
            })
            .catch(error => {
                console.error('Error completing task:', error);
            });
        }
    }

    function uncompleteTask() {
        // Make a POST request to uncomplete the task
        fetch('/uncomplete_task', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 'task_id': task_id[currentTaskIndex],
                'taskseries_id': taskseries_id[currentTaskIndex],
                'truelist_id': truelist_id[currentTaskIndex]
                 }),
        })
        .then(response => response.json())
        .then(data => {
            console.log('Uncompleted Task: ', formatted_tasks[currentTaskIndex]);

            // Remove the task index from completedTasks array
            completedTasks = completedTasks.filter(index => index !== currentTaskIndex);

            // Update the UI with the uncompletion status
            updateTaskName();
        })
        .catch(error => {
            console.error('Error uncompleting task:', error);
        });
    }

    function isTaskCompleted(index) {
        // Check if the task at the given index is in the completedTasks array
        return completedTasks.includes(index);
    }

    function updateTaskName() {
        exitTitleEditMode();
        var taskNameElement = document.querySelector('.task-name');
        var completeButtonElement = document.querySelector('.completeButton');
        taskNameElement.innerHTML = formatted_tasks[currentTaskIndex];

        // Check if the task is completed and apply the completed class
        if (isTaskCompleted(currentTaskIndex)) {
            taskNameElement.classList.add('completed');
            completeButtonElement.innerHTML = 'Uncomplete Task';

            // Stop the timer if the task is completed
            pauseTimer();
        } else {
            taskNameElement.classList.remove('completed');
            completeButtonElement.innerHTML = 'Complete Task';

            // Resume the timer if the task is not completed
            resumeTimer();
        }

        // Update the remaining time for the new task
        remainingTime = moment.duration(remainingSeconds[currentTaskIndex], 'seconds');
        updateCountdown();
    }

    // restore the default styles when a button is clicked.
    function restoreStyles() {
        countdownBox.style.backgroundColor = 'rgb(153, 149, 149)';
        document.body.style.backgroundColor = '#363636';
        overdue = false;
    }

    // Count down from the time estimate until 0 and then starting counting up from the time estimate
function updateCountdown() {
    if (isPaused) {
        return;
    }

    var now = moment();
    var elapsedTime = moment.duration(now.diff(lastUpdateTime)).asSeconds();
    lastUpdateTime = now;

    if (!overdue && remainingTime > 0) {
        // Counting down
        remainingTime.subtract(elapsedTime, 'seconds');
        
        if (remainingTime.asMinutes() >= 1) {
            var formattedTime = Math.ceil(remainingTime.asMinutes()) + " mins";
        } else if (remainingTime > 0) {
            var formattedTime = Math.ceil(remainingTime.asSeconds()) + " seconds";
        } else {
            // Timer just hit zero - switch to overdue mode
            remainingTime = moment.duration(remainingSeconds[currentTaskIndex], 'seconds');
            overdue = true;
            countdownBox.style.backgroundColor = '#df4343';
            document.body.style.backgroundColor = '#461818';
            formattedTime = Math.ceil(remainingTime.asMinutes()) + " mins";
        }
    } else {
        // Counting up (overdue time) - start from original estimate
        if (!overdue) {
            overdue = true;
            remainingTime = moment.duration(remainingSeconds[currentTaskIndex], 'seconds');
            countdownBox.style.backgroundColor = '#995151';
            document.body.style.backgroundColor = '#461818';
        }
        
        remainingTime.add(elapsedTime, 'seconds');
        
        // Always show only minutes when overdue (no seconds)
        formattedTime = Math.ceil(remainingTime.asMinutes()) + " mins";
    }

    // Update the countdown element
    document.getElementById('countdown').innerHTML = formattedTime;
    }

    // Keyboard navigation
    document.addEventListener('keydown', function(event) {
        // Don't trigger shortcuts when typing in input fields
        if (event.target.tagName === 'TEXTAREA' || event.target.tagName === 'INPUT') {
            return;
        }
        
        // Prevent default behavior for space bar to avoid page scrolling
        if (event.code === 'Space') {
            event.preventDefault();
        }
        
        switch(event.key.toLowerCase()) {
            case 'p':
                goToPreviousTask();
                break;
            case 'd':
                completeTask();
                break;
            case 'n':
                skipToNextTask();
                break;
            case ' ':
                toggleTimer();
                break;
            case 'i':
                toggleTaskDetails();
                break;
            case 'l':
                openTaskLink();
                break;
            case 'a':
                event.preventDefault();
                if (!taskDetailsVisible) {
                    toggleTaskDetails();
                }
                document.getElementById('new-annotation').focus();
                break;
            case 't':
                enterTitleEditMode();
                break;
        }
    });

    // Link Functions
    function openTaskLink() {
        var url = taskUrl[currentTaskIndex];
        console.log('Opening task URL:', url);
        
        // Check if task URL is "none" or empty
        if (!url || url.toLowerCase() === 'none') {
            console.log('No link available for current task');
            return;
        }
        
        // Apply the same processing as updateLink function
        var processedUrl = url;
        if (!url.startsWith('http://') && !url.startsWith('https://') && !url.includes('://')) {
            processedUrl = 'http://' + url; // Add http protocol only for domain-like URLs
        }
        
        // Open the link in a new window/tab
        window.open(processedUrl, '_blank');
    }

    // Task Details Functions
    function toggleTaskDetails() {
        const detailsDiv = document.getElementById('task-details');
        const toggleButton = document.getElementById('toggle-details');
        
        taskDetailsVisible = !taskDetailsVisible;
        
        if (taskDetailsVisible) {
            detailsDiv.style.display = 'block';
            toggleButton.textContent = 'Hide';
            updateTaskDetails();
        } else {
            detailsDiv.style.display = 'none';
            toggleButton.textContent = 'Show';
        }
    }

    function refreshCurrentTaskData() {
        const taskId = task_id[currentTaskIndex];
        
        // Fetch updated annotations
        fetch(`/task/${taskId}/annotations`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                task_annotations[currentTaskIndex] = data.annotations;
                if (taskDetailsVisible) {
                    updateAnnotationsDisplay();
                }
            }
        })
        .catch(error => console.error('Error refreshing annotations:', error));
        
        // Fetch updated due date
        fetch(`/task/${taskId}/due`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                task_due_dates[currentTaskIndex] = data.due_date;
                if (taskDetailsVisible) {
                    updateDueDateDisplay();
                }
            }
        })
        .catch(error => console.error('Error refreshing due date:', error));

        // Fetch updated URL
        fetch(`/task/${taskId}/url`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                taskUrl[currentTaskIndex] = data.url || 'none';
                if (taskDetailsVisible) {
                    updateUrlDisplay();
                }
                updateLink();
            }
        })
        .catch(error => console.error('Error refreshing URL:', error));
    }

    function parseTaskWarriorDate(dateString) {
        if (!dateString) return null;
        
        let date;
        
        // Parse various TaskWarrior date formats
        if (dateString.match(/^\d{8}T\d{6}Z$/)) {
            // Format: "20251227T000000Z" (compact ISO)
            const year = dateString.substring(0, 4);
            const month = dateString.substring(4, 6);
            const day = dateString.substring(6, 8);
            const hour = dateString.substring(9, 11);
            const minute = dateString.substring(11, 13);
            const second = dateString.substring(13, 15);
            
            date = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}Z`);
        } else if (dateString.includes('T') && dateString.includes('Z')) {
            // Standard ISO format
            date = new Date(dateString);
        } else if (dateString.includes(' ')) {
            // Format: "2026-01-01 06:38:32"
            date = new Date(dateString.replace(' ', 'T') + 'Z');
        } else {
            // Fallback
            date = new Date(dateString);
        }
        
        return isNaN(date.getTime()) ? null : date;
    }

    function updateTaskDetails() {
        updateAnnotationsDisplay();
        updateDueDateDisplay();
        document.getElementById('tag-add-form').style.display = 'none';
        document.getElementById('new-tag-input').value = '';
        updateTagsDisplay(false);
        updatePriorityDisplay();
        hidePriorityForm();
        updateUrlDisplay();
    }

    function toggleAnnotationSort() {
        annotationSortNewest = !annotationSortNewest;
        document.getElementById('sort-annotations').textContent = annotationSortNewest ? 'Newest first' : 'Oldest first';
        updateAnnotationsDisplay();
    }

    function updateAnnotationsDisplay() {
        const annotationsList = document.getElementById('annotations-list');
        const annotations = task_annotations[currentTaskIndex] || [];

        const sorted = [...annotations].sort((a, b) => {
            const da = parseTaskWarriorDate(a.entry);
            const db = parseTaskWarriorDate(b.entry);
            if (!da && !db) return 0;
            if (!da) return annotationSortNewest ? 1 : -1;
            if (!db) return annotationSortNewest ? -1 : 1;
            return annotationSortNewest ? db - da : da - db;
        });

        annotationsList.innerHTML = '';

        sorted.forEach((annotation, index) => {
            const annotationDiv = document.createElement('div');
            annotationDiv.className = 'annotation-item';

            // Parse the annotation entry date
            const entryDate = parseTaskWarriorDate(annotation.entry);
            const dateDisplay = entryDate ? entryDate.toLocaleDateString() : 'Unknown date';

            // Create annotation text element with click-to-copy
            const annotationText = document.createElement('div');
            annotationText.className = 'annotation-text copyable';
            annotationText.textContent = annotation.description;
            annotationText.onclick = function() {
                copyAnnotation(annotation.description, this);
            };

            // Create annotation meta element
            const annotationMeta = document.createElement('div');
            annotationMeta.className = 'annotation-meta';

            const dateSmall = document.createElement('small');
            dateSmall.textContent = dateDisplay;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Delete';
            deleteBtn.onclick = (function(text) {
                return function() { deleteAnnotation(text); };
            })(annotation.description);

            annotationMeta.appendChild(dateSmall);
            annotationMeta.appendChild(deleteBtn);

            annotationDiv.appendChild(annotationText);
            annotationDiv.appendChild(annotationMeta);
            annotationsList.appendChild(annotationDiv);
        });

        if (sorted.length === 0) {
            annotationsList.innerHTML = '<p class="no-items">No notes yet</p>';
        }

        const form = document.querySelector('.annotation-form');
        if (annotationSortNewest) {
            annotationsList.parentNode.insertBefore(form, annotationsList);
        } else {
            annotationsList.parentNode.insertBefore(form, annotationsList.nextSibling);
        }
    }

    function updateDueDateDisplay() {
        const dueDateDisplay = document.getElementById('due-date-display');
        const dueDate = task_due_dates[currentTaskIndex];
        
        if (dueDate) {
            const parsedDate = parseTaskWarriorDate(dueDate);
            
            if (parsedDate) {
                dueDateDisplay.innerHTML = `<div class="due-date-item">${parsedDate.toLocaleDateString()}</div>`;
            } else {
                dueDateDisplay.innerHTML = `<div class="due-date-item">${dueDate} (parse error)</div>`;
            }
        } else {
            dueDateDisplay.innerHTML = '<p class="no-items">No due date set</p>';
        }
    }

    var tagRemoveMode = false;

    function updateTagsDisplay(removeMode) {
        tagRemoveMode = !!removeMode;
        const tagsDisplay = document.getElementById('tags-display');
        const tags = task_tags[currentTaskIndex] || [];

        tagsDisplay.innerHTML = '';

        if (tags.length > 0) {
            tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'tag-item' + (tagRemoveMode ? ' tag-remove-mode' : '');

                if (tagRemoveMode) {
                    tagElement.textContent = tag;
                    const removeX = document.createElement('button');
                    removeX.className = 'tag-remove-x';
                    removeX.textContent = '×';
                    removeX.onclick = (e) => { e.stopPropagation(); removeTag(tag); };
                    tagElement.appendChild(removeX);
                } else {
                    tagElement.textContent = tag;
                    tagElement.onclick = () => showTagModal(tag);
                }

                tagsDisplay.appendChild(tagElement);
            });
        } else {
            tagsDisplay.innerHTML = '<p class="no-items">No tags</p>';
        }
    }

    function addTag() {
        const taskId = task_id[currentTaskIndex];
        const tagInput = document.getElementById('new-tag-input');
        const tag = tagInput.value.trim();
        if (!tag) return;

        fetch(`/task/${taskId}/tags`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tag: tag})
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                tagInput.value = '';
                document.getElementById('tag-add-form').style.display = 'none';
                return fetch(`/task/${taskId}/tags`);
            } else {
                alert('Error adding tag: ' + data.error);
            }
        })
        .then(r => r && r.json())
        .then(data => {
            if (data) {
                task_tags[currentTaskIndex] = data.tags || [];
                updateTagsDisplay();
            }
        })
        .catch(err => console.error('Error adding tag:', err));
    }

    function removeTag(tag) {
        const taskId = task_id[currentTaskIndex];
        const encodedTag = encodeURIComponent(tag);

        fetch(`/task/${taskId}/tags/${encodedTag}`, {method: 'DELETE'})
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                return fetch(`/task/${taskId}/tags`);
            } else {
                alert('Error removing tag: ' + data.error);
            }
        })
        .then(r => r && r.json())
        .then(data => {
            if (data) {
                task_tags[currentTaskIndex] = data.tags || [];
                updateTagsDisplay();
            }
        })
        .catch(err => console.error('Error removing tag:', err));
    }

    function saveAnnotation() {
        const newAnnotationText = document.getElementById('new-annotation').value.trim();
        
        if (!newAnnotationText) {
            alert('Please enter a note');
            return;
        }
        
        const taskId = task_id[currentTaskIndex];
        
        fetch(`/task/${taskId}/annotations`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ annotation: newAnnotationText })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('new-annotation').value = '';
                // Refresh task data without page reload
                refreshCurrentTaskData();
            } else {
                alert('Error saving note: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error saving note');
        });
    }

    function deleteAnnotation(annotationText) {
        if (!confirm('Delete this note?')) return;
        
        const taskId = task_id[currentTaskIndex];
        
        // URL encode the annotation text for the API call
        const encodedText = encodeURIComponent(annotationText);
        
        fetch(`/task/${taskId}/annotations/${encodedText}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                // Refresh task data without page reload
                refreshCurrentTaskData();
            } else {
                alert('Error deleting note: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error deleting note');
        });
    }

    function saveDueDate() {
        const newDueDate = document.getElementById('new-due-date').value;

        if (!newDueDate) {
            alert('Please select a date');
            return;
        }

        const taskId = task_id[currentTaskIndex];

        fetch(`/task/${taskId}/due`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ due_date: newDueDate })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('new-due-date').value = '';
                // Refresh task data without page reload
                refreshCurrentTaskData();
            } else {
                alert('Error saving due date: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error saving due date');
        });
    }

    function setDueToday() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const todayDate = `${year}-${month}-${day}`;

        const taskId = task_id[currentTaskIndex];

        fetch(`/task/${taskId}/due`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ due_date: todayDate })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                refreshCurrentTaskData();
            } else {
                alert('Error setting due date: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error setting due date');
        });
    }

    function updateUrlDisplay() {
        const urlDisplay = document.getElementById('url-display');
        const url = taskUrl[currentTaskIndex];
        const hasUrl = url && url.toLowerCase() !== 'none';

        urlDisplay.innerHTML = '';

        if (hasUrl) {
            const urlText = document.createElement('div');
            urlText.className = 'url-display-text';
            urlText.textContent = url;

            const urlMeta = document.createElement('div');
            urlMeta.className = 'url-meta';

            const editBtn = document.createElement('button');
            editBtn.className = 'url-action-btn';
            editBtn.textContent = 'Edit';
            editBtn.onclick = showUrlForm;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'delete-btn';
            removeBtn.textContent = 'Remove';
            removeBtn.onclick = removeUrl;

            urlMeta.appendChild(editBtn);
            urlMeta.appendChild(removeBtn);
            urlDisplay.appendChild(urlText);
            urlDisplay.appendChild(urlMeta);
        } else {
            const addBtn = document.createElement('button');
            addBtn.className = 'url-action-btn';
            addBtn.textContent = 'Add Link';
            addBtn.onclick = showUrlForm;
            urlDisplay.appendChild(addBtn);
        }
    }

    function showUrlForm() {
        const url = taskUrl[currentTaskIndex];
        const hasUrl = url && url.toLowerCase() !== 'none';
        document.getElementById('url-input').value = hasUrl ? url : '';
        document.getElementById('url-edit-form').style.display = 'block';
        document.getElementById('url-input').focus();
    }

    function hideUrlForm() {
        document.getElementById('url-edit-form').style.display = 'none';
    }

    function saveUrl() {
        const taskId = task_id[currentTaskIndex];
        const newUrl = document.getElementById('url-input').value.trim();

        if (!newUrl) {
            alert('Please enter a URL');
            return;
        }

        fetch(`/task/${taskId}/url`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: newUrl })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                taskUrl[currentTaskIndex] = newUrl;
                hideUrlForm();
                updateUrlDisplay();
                updateLink();
            } else {
                alert('Error saving URL: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error saving URL');
        });
    }

    function removeUrl() {
        if (!confirm('Remove link?')) return;

        const taskId = task_id[currentTaskIndex];

        fetch(`/task/${taskId}/url`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                taskUrl[currentTaskIndex] = 'none';
                updateUrlDisplay();
                updateLink();
            } else {
                alert('Error removing URL: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error removing URL');
        });
    }

    function removeDueDate() {
        if (!confirm('Remove due date?')) return;
        
        const taskId = task_id[currentTaskIndex];
        
        fetch(`/task/${taskId}/due`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                // Refresh task data without page reload
                refreshCurrentTaskData();
            } else {
                alert('Error removing due date: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error removing due date');
        });
    }

    function copyTaskIdFromModal(taskId, element) {
        navigator.clipboard.writeText(taskId).then(function() {
            console.log('Task ID copied to clipboard: ' + taskId);
            // Visual feedback
            const originalText = element.textContent;
            element.textContent = 'Copied!';
            element.style.color = '#4CAF50';
            setTimeout(function() {
                element.textContent = originalText;
                element.style.color = '';
            }, 1000);
        }).catch(function(err) {
            console.error('Failed to copy task ID: ', err);
        });
    }

    function showTagModal(tag) {
        fetch(`/tasks/by-tag/${tag}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                const modal = document.getElementById('tag-modal');
                const title = document.getElementById('modal-tag-title');
                const taskList = document.getElementById('modal-task-list');
                
                title.textContent = `Tasks with tag: ${tag}`;
                
                taskList.innerHTML = '';
                
                if (data.tasks.length > 0) {
                    data.tasks.forEach(task => {
                        const taskDiv = document.createElement('div');
                        taskDiv.className = 'modal-task-item';
                        
                        // Create text nodes and clickable task ID span
                        const descriptionText = document.createTextNode(`${task.description} (`);
                        const closingParenText = document.createTextNode(')');
                        
                        const taskIdSpan = document.createElement('span');
                        taskIdSpan.textContent = task.short_id;
                        taskIdSpan.className = 'clickable-task-id';
                        taskIdSpan.title = 'Click to copy';
                        taskIdSpan.onclick = function() {
                            copyTaskIdFromModal(task.short_id, this);
                        };
                        
                        // Build the task display properly without innerHTML
                        taskDiv.appendChild(descriptionText);
                        taskDiv.appendChild(taskIdSpan);
                        taskDiv.appendChild(closingParenText);
                        
                        taskList.appendChild(taskDiv);
                    });
                } else {
                    taskList.innerHTML = '<p>No tasks found with this tag</p>';
                }
                
                modal.style.display = 'block';
            } else {
                alert('Error loading tasks: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error loading tasks');
        });
    }

    // Title edit functions (ON-26)
    function enterTitleEditMode() {
        if (isTaskCompleted(currentTaskIndex)) return;
        var h1 = document.querySelector('.task-name');
        var editForm = document.getElementById('title-edit-form');
        var input = document.getElementById('title-input');
        input.value = task_names[currentTaskIndex];
        h1.style.display = 'none';
        editForm.style.display = 'block';
        input.focus();
        input.select();
    }

    function exitTitleEditMode() {
        var h1 = document.querySelector('.task-name');
        var editForm = document.getElementById('title-edit-form');
        h1.style.display = '';
        editForm.style.display = 'none';
    }

    function saveTitleEdit() {
        var newDescription = document.getElementById('title-input').value.trim();
        if (!newDescription) {
            alert('Description cannot be empty');
            return;
        }
        var taskId = task_id[currentTaskIndex];
        fetch(`/task/${taskId}/description`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({description: newDescription})
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                task_names[currentTaskIndex] = newDescription;
                formatted_tasks[currentTaskIndex] = formatTaskTitle(task_priorities[currentTaskIndex], newDescription);
                document.querySelector('.task-name').innerHTML = formatted_tasks[currentTaskIndex];
                exitTitleEditMode();
            } else {
                alert('Error saving: ' + data.error);
            }
        })
        .catch(err => {
            console.error('Error saving description:', err);
            alert('Error saving description');
        });
    }

    // Priority edit functions (ON-29, updated for ON-67/A3 to read the
    // user's actual priority scheme instead of a hardcoded 1/2/3)

    // High/Medium/Low descriptors only make sense for a 3-level scheme
    // (covers both native H/M/L and Porter's custom 1/2/3) — anything else
    // just shows the raw configured value.
    function priorityLabel(value) {
        const index = priorityValues.indexOf(value);
        if (priorityValues.length === 3 && index !== -1) {
            const descriptors = ['High', 'Medium', 'Low'];
            return value + ' (' + descriptors[index] + ')';
        }
        return String(value);
    }

    function formatTaskTitle(priority, name) {
        return priority ? (priority + ': ' + name) : name;
    }

    function populatePriorityOptions() {
        const select = document.getElementById('priority-select');
        select.innerHTML = '';
        priorityValues.forEach(function(value) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = priorityLabel(value);
            select.appendChild(option);
        });
    }

    function updatePriorityDisplay() {
        const priorityDisplay = document.getElementById('priority-display');
        const priority = task_priorities[currentTaskIndex];

        priorityDisplay.innerHTML = '';

        const priorityItem = document.createElement('div');
        priorityItem.className = 'priority-item';
        priorityItem.textContent = priority ? priorityLabel(priority) : 'No priority set';
        priorityDisplay.appendChild(priorityItem);

        // Unknown/empty scheme (no priority_values resolved) — degrade to
        // read-only rather than offering a form that can't validate (ON-67/A3).
        if (priorityValues.length > 0) {
            const editBtn = document.createElement('button');
            editBtn.className = 'url-action-btn';
            editBtn.textContent = 'Edit';
            editBtn.onclick = showPriorityForm;
            priorityDisplay.appendChild(editBtn);
        }
    }

    function showPriorityForm() {
        if (priorityValues.length === 0) return;
        const current = task_priorities[currentTaskIndex];
        document.getElementById('priority-select').value = priorityValues.includes(current) ? current : priorityValues[0];
        document.getElementById('priority-edit-form').style.display = 'block';
    }

    function hidePriorityForm() {
        document.getElementById('priority-edit-form').style.display = 'none';
    }

    function saveTaskPriority() {
        const newPriority = document.getElementById('priority-select').value;
        const taskId = task_id[currentTaskIndex];
        fetch(`/task/${taskId}/priority`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({priority: newPriority})
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                task_priorities[currentTaskIndex] = newPriority;
                formatted_tasks[currentTaskIndex] = formatTaskTitle(newPriority, task_names[currentTaskIndex]);
                document.querySelector('.task-name').innerHTML = formatted_tasks[currentTaskIndex];
                hidePriorityForm();
                updatePriorityDisplay();
            } else {
                alert('Error saving priority: ' + data.error);
            }
        })
        .catch(err => {
            console.error('Error saving priority:', err);
            alert('Error saving priority');
        });
    }

    // Event listeners for buttons
    document.getElementById('toggle-details').onclick = toggleTaskDetails;
    document.getElementById('save-annotation').onclick = saveAnnotation;
    document.getElementById('new-annotation').addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && event.metaKey) {
            event.preventDefault();
            saveAnnotation();
        }
    });
    document.getElementById('sort-annotations').onclick = toggleAnnotationSort;
    document.getElementById('save-title').onclick = saveTitleEdit;
    document.getElementById('cancel-title').onclick = exitTitleEditMode;
    document.getElementById('title-input').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') { event.preventDefault(); saveTitleEdit(); }
        if (event.key === 'Escape') { exitTitleEditMode(); }
    });
    document.getElementById('save-priority').onclick = saveTaskPriority;
    document.getElementById('cancel-priority').onclick = hidePriorityForm;
    document.getElementById('save-url').onclick = saveUrl;
    document.getElementById('cancel-url').onclick = hideUrlForm;
    document.getElementById('save-due-date').onclick = saveDueDate;
    document.getElementById('due-today').onclick = setDueToday;
    document.getElementById('remove-due-date').onclick = removeDueDate;
    document.getElementById('add-tag-btn').onclick = function() {
        document.getElementById('tag-add-form').style.display = 'block';
        document.getElementById('new-tag-input').focus();
        updateTagsDisplay(false);
    };
    document.getElementById('remove-tag-btn').onclick = function() {
        document.getElementById('tag-add-form').style.display = 'none';
        updateTagsDisplay(!tagRemoveMode);
    };
    document.getElementById('save-tag').onclick = addTag;
    document.getElementById('cancel-tag').onclick = function() {
        document.getElementById('tag-add-form').style.display = 'none';
        document.getElementById('new-tag-input').value = '';
    };
    document.getElementById('new-tag-input').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') { event.preventDefault(); addTag(); }
        if (event.key === 'Escape') { document.getElementById('cancel-tag').click(); }
    });

    // Modal close functionality
    document.getElementById('tag-modal-close').onclick = function() {
        document.getElementById('tag-modal').style.display = 'none';
    }

    window.onclick = function(event) {
        const tagModal = document.getElementById('tag-modal');
        if (event.target === tagModal) {
            tagModal.style.display = 'none';
        }
    }

    // Update task navigation functions to refresh details when visible
    function goToTaskIndex(index) {
        if (index < 0 || index >= numTasks) return;
        currentTaskIndex = index;
        updateTaskName();
        restoreStyles();
        updateLink();
        updateTaskId();
        updateEstimateNotice();
        if (taskDetailsVisible) {
            updateTaskDetails();
        }
    }

    function goToPreviousTask() {
        goToTaskIndex(currentTaskIndex - 1);
    }

    function skipToNextTask() {
        goToTaskIndex(currentTaskIndex + 1);
    }

    // Start the countdown
    populatePriorityOptions();
    updateCountdown();
    updateLink();
    updateTaskId();
    updateEstimateNotice();
    // Schedule the next update in 1 second
    countdownInterval = setInterval(updateCountdown, 1000); 
    </script>
</body>
</html>
